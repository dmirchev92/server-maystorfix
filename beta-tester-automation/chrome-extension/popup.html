<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 320px; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; }
    h1 { font-size: 14px; margin-bottom: 12px; color: #60a5fa; }
    .status { padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 12px; line-height: 1.4; }
    .status.ok { background: #064e3b; border: 1px solid #10b981; }
    .status.err { background: #7f1d1d; border: 1px solid #ef4444; }
    .status.loading { background: #1e293b; border: 1px solid #475569; }
    .time { color: #94a3b8; font-size: 11px; margin-top: 4px; }
    .btn { display: block; width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; background: #3b82f6; color: white; }
    .btn:hover { background: #2563eb; }
    .btn:disabled { background: #475569; cursor: wait; }
    .btn.success { background: #10b981; }
    .info { font-size: 11px; color: #64748b; margin-top: 8px; text-align: center; }
  </style>
</head>
<body>
  <h1>🍪 SnapFix Cookie Sync</h1>
  <div id="status" class="status loading">Зареждане...</div>
  <button id="syncBtn" class="btn" onclick="manualSync()">Синхронизирай сега</button>
  <div class="info">Автоматично на всеки 4 часа</div>

  <script>
    function loadStatus() {
      chrome.storage.local.get('lastSync', (result) => {
        const el = document.getElementById('status');
        const data = result.lastSync;
        if (!data) {
          el.className = 'status loading';
          el.innerHTML = '⚠️ Няма данни. Натиснете бутона за първа синхронизация.';
          return;
        }
        if (data.success) {
          el.className = 'status ok';
          el.innerHTML = `✅ Качени <strong>${data.cookieCount}</strong> бисквитки<div class="time">${new Date(data.timestamp).toLocaleString('bg-BG')}</div>`;
        } else {
          el.className = 'status err';
          el.innerHTML = `❌ ${data.message}<div class="time">${new Date(data.timestamp).toLocaleString('bg-BG')}</div>`;
        }
      });
    }

    function manualSync() {
      const btn = document.getElementById('syncBtn');
      btn.disabled = true;
      btn.textContent = 'Синхронизиране...';

      chrome.runtime.sendMessage({ action: 'syncNow' }, (result) => {
        if (result && result.success) {
          btn.className = 'btn success';
          btn.textContent = '✅ Готово!';
        } else {
          btn.textContent = '❌ ' + (result ? result.message : 'Грешка');
        }
        setTimeout(() => {
          btn.className = 'btn';
          btn.textContent = 'Синхронизирай сега';
          btn.disabled = false;
          loadStatus();
        }, 3000);
      });
    }

    loadStatus();
  </script>
</body>
</html>
